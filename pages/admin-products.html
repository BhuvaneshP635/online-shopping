
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - ShopEase</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/products.css">
</head>
<body>

    <header class="product-header">
        <h1>ShopEase Admin</h1>
        <div>
            <a href="admin-dashboard.html">Dashboard</a>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="catalogue">
        <h2>Product Management</h2>

        <form id="productForm">
            <input type="hidden" id="productId">

            <input type="text" id="title" placeholder="Product Name" required>

            <input type="text" id="description" placeholder="Description" required>
            <label for="imageUrl">Product Image URL</label>
<input
    type="url"
    id="imageUrl"
    placeholder="https://example.com/product.jpg"
>

            <label for="categoryId">Select Category</label>
<select id="categoryId" required>
    <option value="">Select a category</option>
</select>

            <input type="number" id="price" placeholder="Price" min="0.01" step="0.01" required>

            <input type="number" id="quantity" placeholder="Quantity" min="0" step="1" required>

            <label>
                <input type="checkbox" id="active" checked>
                Active Product
            </label>

            <button type="submit" id="saveButton">Add Product</button>
            <button type="button" id="clearButton">Clear Form</button>
        </form>

        <p id="message"></p>

        <h2>Available Products</h2>

        <div id="adminProductContainer" class="product-grid"></div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/admin-products.js"></script>

</body>
</html>
